name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create build_app --platforms=android --project-name madan --org com.madan.app
      - run: |
          cp src/pubspec.yaml build_app/pubspec.yaml
          sed -i 's/^name: doska/name: madan/' build_app/pubspec.yaml
          cp -r src/lib/. build_app/lib/
          M=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent></queries>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="MADAN"#' $M
      - run: flutter pub get && flutter build apk --release
        working-directory: build_app
      - run: cp build_app/build/app/outputs/flutter-apk/app-release.apk madan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: madan-apk
          path: madan.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MADAN (последняя версия)
          files: madan.apk
